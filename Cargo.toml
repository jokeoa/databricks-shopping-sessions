[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
parquet = { version = "57", default-features = false }
serde_json = "1"
foldhash = "0.2"
memchr = "2"
memmap2 = "0.9"
libc = "0.2"

[features]
default = []
diag = []
mutate = ["diag"]

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
